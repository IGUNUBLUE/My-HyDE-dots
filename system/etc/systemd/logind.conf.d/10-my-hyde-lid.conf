# Installed by My-HyDE-dots (`./install.sh --only system`).
# Closing the lid must never suspend or hibernate: Hyprland locks the session
# and powers off the internal panel through the lid switch binds in
# ~/.config/hypr/hyprland.lua, and the machine keeps working.
# Remove this file (or run ./restore.sh) to return to logind's default.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
