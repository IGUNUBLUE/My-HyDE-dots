# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, runs a scoped Codacy security scan and
# integrates the results with the GitHub Advanced Security code scanning
# feature.
#
# The scan is deliberately restricted to Bandit and ShellCheck. Running the
# Codacy CLI default toolset over this repository produces mostly false
# positives: the Waybar stylesheet is GTK CSS that uses @define-color
# references and alpha(), and the Python tools use PEP 563/585 annotations
# that the bundled legacy Pylint and Prospector cannot parse. .codacy.yaml
# backs this up with path exclusions for the non-executable trees.
#
# For more information on the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '41 12 * * 1'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Python security analysis
      - name: Run Codacy Analysis CLI (Bandit)
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          tool: bandit
          output: bandit.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # Shell safety analysis: install.sh, restore.sh, update-snapshot.sh,
      # check.sh and the dotfiles/.local/bin helpers
      - name: Run Codacy Analysis CLI (ShellCheck)
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          tool: shellcheck
          output: shellcheck.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      # Each upload needs its own category, otherwise the second upload
      # supersedes the results of the first
      - name: Upload Bandit SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Upload ShellCheck SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: shellcheck.sarif
          category: shellcheck
